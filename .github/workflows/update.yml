name: Update Live

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run script
        run: python main.py

      - name: Commit file
        run: |
          git config --global user.name github-actions
          git config --global user.email actions@github.com

          git add .

          git commit -m "update stream" || echo "No changes"

          git push || true
